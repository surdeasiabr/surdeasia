<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Pedidos - Surdeasia</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #1f3b4d; text-align: center; margin-bottom: 4px; }
        .subtitle { text-align: center; color: #777; font-size: 0.9em; margin-bottom: 20px; }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            min-width: 900px;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            vertical-align: top;
        }
        th {
            background-color: #1f3b4d;
            color: white;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        tr:hover { background-color: #f8fbfa; }

        .status {
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.82em;
            white-space: nowrap;
            display: inline-block;
        }
        .status-pending   { background: #ffeeba; color: #856404; }
        .status-confirmed { background: #d4edda; color: #155724; }
        .status-rejected  { background: #f8d7da; color: #721c24; }

        .items-list {
            font-size: 0.88em;
            color: #444;
            margin: 0;
            padding-left: 0;
            list-style: none;
            line-height: 1.7;
        }
        .items-list li {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
        }
        .items-list li:last-child { border-bottom: none; margin-bottom: 0; }

        .customer-block { line-height: 1.8; font-size: 0.9em; }
        .customer-block strong { font-size: 1em; color: #1f3b4d; }
        .label {
            color: #999;
            font-size: 0.78em;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .address-block {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #ddd;
            font-size: 0.85em;
            color: #555;
            line-height: 1.7;
        }
        .order-id {
            font-family: monospace;
            background: #eef2f7;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #1f3b4d;
        }
        .total-cell {
            font-weight: 700;
            color: #1f3b4d;
            white-space: nowrap;
        }
        .refresh-btn {
            display: inline-block;
            margin-bottom: 14px;
            padding: 8px 18px;
            background: #1f3b4d;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
        }
        .refresh-btn:hover { background: #2b5a78; }

        .coupon-panel {
            background: #eef2f7;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #dce4ec;
        }
        .coupon-panel input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .coupon-panel button {
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .coupon-panel button:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📋 Histórico de Pedidos</h1>
        <p class="subtitle"><a href="/admin" style="color: #007bff; text-decoration: none;">← Ir para Estoque</a></p>

        <div class="coupon-panel">
            <strong>🎫 Gerar Vale-Compras:</strong>
            <input type="text" id="new-coupon-code" placeholder="CÓDIGO (ex: TROCA-ANA)">
            <input type="number" id="new-coupon-value" placeholder="Valor em R$" style="width: 120px;">
            <button onclick="createCoupon()">Gerar Cupom</button>
        </div>

        <button class="refresh-btn" onclick="loadOrders()">🔄 Atualizar Pedidos</button>

        <table id="ordersTable">
            <thead>
                <tr>
                    <th style="width:90px">Data</th>
                    <th style="width:240px">Cliente</th>
                    <th>Itens</th>
                    <th style="width:110px">Total</th>
                    <th style="width:110px">Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated by JS -->
            </tbody>
        </table>
    </div>

    <script>
        async function createCoupon() {
            const code = document.getElementById('new-coupon-code').value.trim();
            const valueReais = parseFloat(document.getElementById('new-coupon-value').value);
            
            if (!code || isNaN(valueReais) || valueReais <= 0) {
                return alert('Preencha o código e um valor válido em R$.');
            }

            const valueCents = Math.round(valueReais * 100);

            try {
                const res = await fetch('/api/coupons', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, value_cents: valueCents })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert(`✅ Cupom gerado com sucesso!\n\nCódigo: ${data.code}\nValor: R$ ${valueReais.toFixed(2)}\n\nEnvie este código para a cliente.`);
                    document.getElementById('new-coupon-code').value = '';
                    document.getElementById('new-coupon-value').value = '';
                } else {
                    alert('Erro: ' + (data.error || 'Falha ao gerar cupom.'));
                }
            } catch (e) {
                console.error(e);
                alert('Erro de conexão ao gerar cupom.');
            }
        }

        function formatDate(dateString) {
            const d = new Date(dateString);
            return d.toLocaleDateString('pt-BR', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        async function loadOrders() {
            const tbody = document.querySelector('#ordersTable tbody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#999; padding:30px;">Carregando...</td></tr>';
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();

                tbody.innerHTML = '';

                if (!Array.isArray(orders) || orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#999; padding:30px;">Nenhum pedido encontrado.</td></tr>';
                    return;
                }

                // Sort orders: Confirmado first, then Pendente, then others
                orders.sort((a, b) => {
                    const rank = { 'confirmed': 1, 'pending': 2, 'cancelled': 3, 'rejected': 4 };
                    const rankA = rank[a.status] || 5;
                    const rankB = rank[b.status] || 5;
                    if (rankA !== rankB) return rankA - rankB;
                    // Sort by date descending for same status
                    return new Date(b.created_at) - new Date(a.created_at);
                });

                orders.forEach(order => {

                    // ── Items ──
                    let itemsHtml = '<p style="color:#bbb;font-size:0.85em;">—</p>';
                    try {
                        const items = JSON.parse(order.items);
                        itemsHtml = '<ul class="items-list">' +
                            items.map(i => {
                                if (i.id === 'shipping') {
                                    return `<li>🚚 <em>${i.name}</em></li>`;
                                }
                                return `<li>
                                    <strong>${i.quantity}x ${i.name}</strong><br>
                                    &nbsp;&nbsp;🎨 <span class="label">Cor:</span> ${i.color || '—'}<br>
                                    &nbsp;&nbsp;📏 <span class="label">Tamanho:</span> ${i.size || '—'}
                                </li>`;
                            }).join('') +
                            '</ul>';
                    } catch(e) {}

                    // ── Status ──
                    let statusClass = 'status-pending';
                    let statusText  = '⏳ Pendente';
                    if (order.status === 'confirmed') { statusClass = 'status-confirmed'; statusText = '✅ Confirmado'; }
                    if (order.status === 'rejected')  { statusClass = 'status-rejected';  statusText = '❌ Recusado'; }
                    if (order.status === 'cancelled') { statusClass = 'status-rejected';  statusText = '❌ Cancelado'; }

                    // ── Address ──
                    const hasAddress = order.address_street || order.address_cep;
                    const addressHtml = hasAddress ? `
                        <div class="address-block">
                            📍 <strong>Endereço de entrega:</strong><br>
                            ${order.address_street || ''}${order.address_number ? ', ' + order.address_number : ''}<br>
                            ${order.address_neighborhood ? order.address_neighborhood + '<br>' : ''}
                            ${order.address_city || ''}${order.address_state ? ' - ' + order.address_state : ''}<br>
                            <span class="label">CEP:</span> ${order.address_cep || '—'}
                        </div>
                    ` : '';

                    // ── Cancel Button ──
                    const cancelBtnHtml = (order.status === 'pending' || order.status === 'confirmed') ? 
                        `<br><button onclick="cancelOrder('${order.id}')" style="margin-top: 10px; font-size: 0.75em; padding: 4px 8px; background: #fff; border: 1px solid #dc3545; color: #dc3545; border-radius: 4px; cursor: pointer;">❌ Cancelar</button>` : '';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-size:0.82em; color:#555; white-space:nowrap;">${formatDate(order.created_at)}</td>
                        <td>
                            <div class="customer-block">
                                <span class="order-id">#${order.id}</span><br>
                                <strong>${order.customer_name || '—'}</strong><br>
                                <span class="label">Email:</span> ${order.customer_email || '—'}<br>
                                <span class="label">Tel:</span> ${order.customer_phone || '—'}<br>
                                <span class="label">CPF:</span> ${order.customer_cpf || '—'}
                                ${addressHtml}
                            </div>
                        </td>
                        <td>${itemsHtml}</td>
                        <td class="total-cell">R$ ${(order.total_cents / 100).toFixed(2).replace('.', ',')}</td>
                        <td>
                            <span class="status ${statusClass}">${statusText}</span>
                            ${cancelBtnHtml}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red; padding:20px;">Erro ao carregar pedidos.</td></tr>';
            }
        }

        async function cancelOrder(id) {
            if (!confirm('Tem certeza que deseja CANCELAR este pedido e devolver os produtos ao estoque?\n\n(Se o cliente já pagou, você precisará estornar o dinheiro no Mercado Pago manualmente)')) {
                return;
            }
            try {
                const res = await fetch(`/api/orders/${id}/cancel`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    alert('Pedido cancelado com sucesso e estoque devolvido!');
                    loadOrders(); // Recarrega a tabela
                } else {
                    alert('Erro: ' + (data.error || 'Falha ao cancelar pedido.'));
                }
            } catch (e) {
                console.error(e);
                alert('Erro de conexão ao tentar cancelar.');
            }
        }

        loadOrders();
    </script>
</body>
</html>
